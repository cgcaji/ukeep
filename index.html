<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Manutenção Predial</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f4f4;
      --panel: #ffffff;
      --text: #333333;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #d4f8e8;
      --success-text: #217a3a;
      --error: #ffdede;
      --error-text: #991b1b;
      --muted: #64748b;
      --border: #dddddd;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      background: var(--panel);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 32px;
      max-width: 640px;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .state {
      padding: 20px;
      border-radius: 8px;
      margin-top: 16px;
      background: #f1f5f9;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .state.error { background: var(--error); color: var(--error-text); }
    .state.success { background: var(--success); color: var(--success-text); }
    .state.loading { background: #eff6ff; color: #1e40af; }

    .spinner {
      border: 3px solid #e2e8f0;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 10px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .profile-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      background: #eff6ff;
      color: var(--primary-dark);
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>Manutenção Predial</h1>
    <p class="subtitle">Sistema de gestão de manutenção dos Salões do Reino</p>

    <div id="content">
      <div class="state loading">
        <span class="spinner"></span> Iniciando...
      </div>
    </div>

    <div class="footer">
      <span id="footer-info">eMesas &middot; ukeep</span>
    </div>
  </div>

  <script>
    // ------------------------------------------------------------
    // CONFIG
    // ------------------------------------------------------------

    // Orchestrator base URL (MVP: single orchestrator, hardcoded)
    const ORCHESTRATOR_URL = 'https://script.google.com/macros/s/AKfycbxSFKTksvmFI-oIPU3r1GaMlNaAn2zD3PfdwFmgfSwKrJUapemwOD0DXPufwu3uDB5d1A/exec';

    // ------------------------------------------------------------
    // HELPERS
    // ------------------------------------------------------------

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function render(html, stateClass) {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="state ' + (stateClass || '') + '">' + html + '</div>';
    }

    function buildUrl(action, extraParams) {
      const parts = ['action=' + encodeURIComponent(action)];
      if (extraParams) {
        Object.keys(extraParams).forEach(function (k) {
          if (extraParams[k] !== undefined && extraParams[k] !== null) {
            parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(extraParams[k]));
          }
        });
      }
      return ORCHESTRATOR_URL + '?' + parts.join('&');
    }

    // ------------------------------------------------------------
    // API CALL
    // ------------------------------------------------------------

    async function callApi(action, params) {
      const url = buildUrl(action, params);

      try {
        const response = await fetch(url, {
          method: 'GET',
          mode: 'cors',
          redirect: 'follow'
        });

        if (!response.ok) {
          return { success: false, error: 'http_' + response.status };
        }

        const text = await response.text();

        // Try to parse as JSON; if it fails, return raw text
        try {
          return JSON.parse(text);
        } catch (e) {
          return { success: true, raw: text };
        }

      } catch (err) {
        return {
          success: false,
          error: 'network_error',
          message: err.message
        };
      }
    }

    // ------------------------------------------------------------
    // MAIN FLOW
    // ------------------------------------------------------------

    async function init() {
      const key = getQueryParam('k');

      // No key → welcome message
      if (!key) {
        render(
          '<strong>Bem-vindo.</strong><br><br>' +
          'Para acessar o sistema, use o link enviado pelo seu coordenador ' +
          'ou supervisor.<br><br>' +
          'O link contém uma chave pessoal no formato <code>?k=...</code>.',
          'success'
        );
        return;
      }

      // Has key → authenticate
      render('<span class="spinner"></span> Autenticando...', 'loading');

      const result = await callApi('auth', { k: key });

      // Error handling
      if (!result.success) {
        let message = 'Não foi possível autenticar.';

        if (result.error === 'network_error') {
          message += '<br><br>Erro de rede ou bloqueio do navegador.';
          if (result.message) {
            message += '<br><br><small style="opacity:.7;">' + result.message + '</small>';
          }
        } else if (result.error === 'invalid_key') {
          message += '<br><br>A chave é inválida ou expirou.';
          message += '<br>Solicite um novo link ao seu coordenador ou supervisor.';
        } else {
          message += '<br><br><small style="opacity:.7;">Erro: ' + (result.error || 'desconhecido') + '</small>';
        }

        render(message, 'error');
        return;
      }

      // Success → route by profile
      const profile = result.profile || 'unknown';

      let profileLabel = profile;
      if (profile === 'coordinator') profileLabel = 'Coordenador';
      else if (profile === 'supervisor') profileLabel = 'Supervisor';
      else if (profile === 'assignee') profileLabel = 'Encarregado';
      else if (profile === 'assistant') profileLabel = 'Ajudante';
      else if (profile === 'substitute') profileLabel = 'Substituto';

      render(
        '<strong>Bem-vindo!</strong><br><br>' +
        'Você está autenticado no sistema.' +
        '<br><span class="profile-badge">' + profileLabel + '</span>' +
        '<br><br>' +
        'As telas de operação estarão disponíveis nas próximas fases.',
        'success'
      );
    }

    // ------------------------------------------------------------
    // BOOT
    // ------------------------------------------------------------

    init();
  </script>
</body>
</html>
