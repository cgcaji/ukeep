<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="uKeep">
  <meta name="theme-color" content="#0f172a">
  <title>uKeep | Manutenção Predial</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%230f172a'/%3E%3Ctext x='96' y='120' font-size='96' text-anchor='middle' fill='white' font-family='sans-serif'%3EuK%3C/text%3E%3C/svg%3E">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f4f4;
      color: #333;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body:not(.app-loaded) {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    body.app-loaded {
      display: block;
      padding: 0;
      background: #f4f4f4;
    }

    .boot-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 32px;
      max-width: 640px;
      width: 100%;
    }

    .boot-card h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #0f172a;
    }

    .boot-card .subtitle {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .state {
      padding: 20px;
      border-radius: 8px;
      background: #f1f5f9;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .state.error {
      background: #ffdede;
      color: #991b1b;
    }

    .state.success {
      background: #d4f8e8;
      color: #217a3a;
    }

    .state.loading {
      background: #eff6ff;
      color: #1e40af;
    }

    .spinner {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div class="boot-card">
    <h1>uKeep</h1>
    <p class="subtitle">Manutenção Predial</p>
    <div id="boot-content">
      <div class="state loading">
        <span class="spinner"></span> Iniciando...
      </div>
    </div>
    <button id="ukeep-install-btn" onclick="ukeepInstall()" style="display:none;margin-top:16px;padding:10px 16px;border:0;border-radius:8px;
             background:#0f172a;color:#fff;font-size:0.9rem;cursor:pointer;">
      📲 Instalar aplicativo
    </button>
    <p id="ukeep-ios-hint" style="display:none;margin-top:12px;color:#64748b;font-size:0.85rem;text-align:center;">
      Para instalar no iPhone: toque em <strong>Compartilhar</strong> → <strong>Adicionar à Tela de Início</strong>.
    </p>
  </div>

  <script>
    var ORCHESTRATOR_URL = 'https://script.google.com/macros/s/AKfycbxSFKTksvmFI-oIPU3r1GaMlNaAn2zD3PfdwFmgfSwKrJUapemwOD0DXPufwu3uDB5d1A/exec';

    var APP_CACHE_KEY = 'ukeep_app_html';
    var APP_CACHE_TS_KEY = 'ukeep_app_timestamp';
    var APP_CACHE_TTL_MS = 60 * 60 * 1000; // 1 hour

    function bootRender(html, stateClass) {
      var el = document.getElementById('boot-content');
      if (el) {
        el.innerHTML = '<div class="state ' + (stateClass || '') + '">' + html + '</div>';
      }
    }

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function apiCall(action, params) {
      var parts = ['action=' + encodeURIComponent(action)];
      if (params) {
        Object.keys(params).forEach(function (k) {
          if (params[k] !== undefined && params[k] !== null) {
            parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
          }
        });
      }
      var url = ORCHESTRATOR_URL + '?' + parts.join('&');

      return fetch(url, { method: 'GET', mode: 'cors', redirect: 'follow' })
        .then(function (response) {
          if (!response.ok) return { success: false, error: 'http_' + response.status };
          return response.text().then(function (text) {
            try { return JSON.parse(text); } catch (e) { return { success: true, raw: text }; }
          });
        })
        .catch(function (err) {
          return { success: false, error: 'network_error', message: err.message };
        });
    }

    /**
     * Read the cached app HTML from localStorage, if fresh.
     * Returns null if missing or expired.
     */
    function getCachedApp() {
      try {
        var html = localStorage.getItem(APP_CACHE_KEY);
        var ts = localStorage.getItem(APP_CACHE_TS_KEY);
        if (!html || !ts) return null;

        var age = Date.now() - parseInt(ts, 10);
        if (age > APP_CACHE_TTL_MS) {
          localStorage.removeItem(APP_CACHE_KEY);
          localStorage.removeItem(APP_CACHE_TS_KEY);
          return null;
        }
        return html;
      } catch (e) {
        // localStorage may be disabled (private mode, quota)
        return null;
      }
    }

    /**
     * Save the app HTML to localStorage with the current timestamp.
     */
    function setCachedApp(html) {
      try {
        localStorage.setItem(APP_CACHE_KEY, html);
        localStorage.setItem(APP_CACHE_TS_KEY, Date.now().toString());
      } catch (e) {
        // Ignore quota / private mode errors
      }
    }

    function injectHtml(html) {
      var range = document.createRange();
      range.selectNode(document.body);
      var docFragment = range.createContextualFragment(html);
      document.body.innerHTML = '';
      document.body.classList.add('app-loaded');
      document.body.append(docFragment);
    }

    function bootApp(html) {
      injectHtml(html);
      setTimeout(function () {
        if (typeof window.ukeepBoot === 'function') {
          try {
            window.ukeepBoot();
          } catch (e) {
            console.error('ukeepBoot error:', e);
            document.body.innerHTML = '<div class="state error" style="margin:20px;">Erro ao inicializar: ' + e.message + '</div>';
          }
        } else {
          document.body.innerHTML = '<div class="state error" style="margin:20px;">Aplicação inválida: hook de boot ausente.</div>';
        }
      }, 0);
    }

    function boot() {
      var key = getQueryParam('k');

      if (!key) {
        bootRender(
          '<strong>Bem-vindo.</strong><br><br>' +
          'Para acessar o sistema, use o link enviado pelo seu coordenador ' +
          'ou supervisor.<br><br>' +
          'O link contém uma chave pessoal no formato <code>?k=...</code>.',
          'success'
        );
        return;
      }

      bootRender('<span class="spinner"></span> Autenticando...', 'loading');

      apiCall('auth', { k: key }).then(function (authResult) {
        if (!authResult.success) {
          var message = 'Não foi possível autenticar.';
          if (authResult.error === 'invalid_key') {
            message += '<br><br>A chave é inválida ou expirou.';
            message += '<br>Solicite um novo link ao seu coordenador ou supervisor.';
          } else if (authResult.error === 'network_error') {
            message += '<br><br>Erro de rede ou bloqueio do navegador.';
          } else {
            message += '<br><br><small>Erro: ' + (authResult.error || 'desconhecido') + '</small>';
          }
          bootRender(message, 'error');
          return;
        }

        sessionStorage.setItem('session_token', authResult.session_token);
        sessionStorage.setItem('profile', authResult.profile);
        sessionStorage.setItem('person_id', authResult.person_id);
        if (authResult.source) sessionStorage.setItem('source', authResult.source);
        if (authResult.property_id) sessionStorage.setItem('property_id', authResult.property_id);
        if (authResult.property_name) sessionStorage.setItem('property_name', authResult.property_name);
        if (authResult.spreadsheet_id) sessionStorage.setItem('spreadsheet_id', authResult.spreadsheet_id);

        // Try cache first
        var cachedHtml = getCachedApp();
        if (cachedHtml) {
          bootApp(cachedHtml);
          return;
        }

        // Cache miss — fetch from backend
        bootRender('<span class="spinner"></span> Carregando aplicação...', 'loading');

        return apiCall('renderApp', { sessionToken: authResult.session_token });
      }).then(function (appResult) {
        if (!appResult) return;

        if (!appResult.success || !appResult.html) {
          bootRender('Falha ao carregar a aplicação: ' + (appResult.error || 'desconhecido'), 'error');
          return;
        }

        // Save to cache and boot
        setCachedApp(appResult.html);

        if (appResult.property) {
          window.__ukeepInitialProperty = appResult.property;
        }

        if (appResult.lang) {
          window.__ukeepLang = appResult.lang;
        }

        if (appResult.dictionary) {
          window.__ukeepDict = appResult.dictionary;
        }

        bootApp(appResult.html);

      }).catch(function (err) {
        bootRender('Erro inesperado: ' + err.message, 'error');
      });
    }
    // ---- PWA: detecção de plataforma ----
    window.ukeepIsIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    window.ukeepIsStandalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    // Mostra dica iOS quando aplicável (Safari não dispara beforeinstallprompt)
    if (window.ukeepIsIOS && !window.ukeepIsStandalone) {
      var hint = document.getElementById('ukeep-ios-hint');
      if (hint) hint.style.display = 'block';
    }

    // Exibe botão de instalação quando PWA está instalável
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.deferredPrompt = e;
      var btn = document.getElementById('ukeep-install-btn');
      if (btn) btn.style.display = 'block';
    });

    // Handler do botão de instalação
    function ukeepInstall() {
      var btn = document.getElementById('ukeep-install-btn');
      if (window.deferredPrompt) {
        window.deferredPrompt.prompt();
        window.deferredPrompt.userChoice.then(function (choice) {
          if (choice.outcome === 'accepted') {
            if (btn) btn.style.display = 'none';
          }
          window.deferredPrompt = null;
        });
      }
    }
    window.ukeepInstall = ukeepInstall;

    // Ocultar botão se já instalado
    window.addEventListener('appinstalled', function () {
      var btn = document.getElementById('ukeep-install-btn');
      if (btn) btn.style.display = 'none';
      window.deferredPrompt = null;
    });

    // ---- PWA: registrar o Service Worker (obrigatório para instalação) ----
    // Sem um SW com handler `fetch`, o Chrome/Edge NÃO disparam
    // beforeinstallprompt e o app nunca fica instalável.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(function (reg) {
            console.log('[uKeep] Service Worker registrado:', reg.scope);
          })
          .catch(function (err) {
            console.warn('[uKeep] Falha ao registrar Service Worker:', err);
          });
      });
    }

    boot();
  </script>
</body>

</html>
