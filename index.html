<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="uKeep">
  <meta name="theme-color" content="#0f172a">
  <title>uKeep | Manutenção Predial</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%230f172a'/%3E%3Ctext x='96' y='120' font-size='96' text-anchor='middle' fill='white' font-family='sans-serif'%3EuK%3C/text%3E%3C/svg%3E">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f4f4;
      color: #333;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body:not(.app-loaded) {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    body.app-loaded {
      display: block;
      padding: 0;
      background: #f4f4f4;
    }

    .boot-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 32px;
      max-width: 640px;
      width: 100%;
    }

    .boot-card h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #0f172a;
    }

    .boot-card .subtitle {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    /* Splash (autenticação + carregamento da interface): tela cheia, SEM card
       — apenas o brand + o spinner unificado do app. O card volta a aparecer
       nos estados de boas-vindas/erro (quando o body perde .ukeep-splash). */
    body.ukeep-splash .boot-card {
      background: transparent;
      box-shadow: none;
      padding: 0;
      max-width: none;
      width: auto;
      text-align: center;
    }

    body.ukeep-splash .boot-card h1 {
      font-size: 2.5rem;
      margin-bottom: 6px;
    }

    body.ukeep-splash .boot-card .subtitle {
      font-size: 1rem;
      margin-bottom: 32px;
    }

    .state {
      padding: 20px;
      border-radius: 8px;
      background: #f1f5f9;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .state.error {
      background: #ffdede;
      color: #991b1b;
    }

    .state.success {
      background: #d4f8e8;
      color: #217a3a;
    }

    /* Loading = mesma splash com o brand (o boot-card do uKeep permanece
       visível), apenas com o spinner unificado do app + texto centralizados.
       NÃO cobre a tela: a tela de autenticação/carregamento mantém o brand. */
    .state.loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: transparent;
      color: #1e40af;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 0;
      padding: 20px;
      text-align: center;
    }

    .spinner {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 10px;
    }

    .state.loading .spinner {
      margin-right: 0;
      width: 36px;
      height: 36px;
      border-width: 4px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
  </style>
</head>

<body class="ukeep-splash">
  <div class="boot-card">
    <h1>uKeep</h1>
    <p class="subtitle">Manutenção Predial</p>
    <div id="boot-content">
      <div class="state loading">
        <span class="spinner"></span> Iniciando...
      </div>
    </div>
  </div>

  <!-- PWA install controls: FICAM FORA do boot-card para sobreviverem ao boot -->
  <button id="ukeep-install-btn" onclick="ukeepInstall()"
    style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:5000;padding:12px 20px;border:0;border-radius:10px;background:#0f172a;color:#fff;font-size:0.95rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3);">
    📲 Instalar aplicativo
  </button>
  <p id="ukeep-ios-hint"
    style="display:none;position:fixed;left:0;right:0;bottom:16px;z-index:5000;margin:0 auto;max-width:340px;background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.15);padding:12px 16px;color:#64748b;font-size:0.85rem;text-align:center;">
    Para instalar no iPhone: toque em <strong>Compartilhar</strong> → <strong>Adicionar à Tela de Início</strong>.
  </p>

  <script>
    var ORCHESTRATOR_URL = 'https://script.google.com/macros/s/AKfycbxSFKTksvmFI-oIPU3r1GaMlNaAn2zD3PfdwFmgfSwKrJUapemwOD0DXPufwu3uDB5d1A/exec';

    var APP_CACHE_KEY = 'ukeep_app_html';
    var APP_CACHE_TS_KEY = 'ukeep_app_timestamp';
    var APP_CACHE_TTL_MS = 60 * 60 * 1000; // 1 hour

    // ============================================================
    // PWA: registrar o Service Worker IMEDIATAMENTE.
    // O Chrome só dispara `beforeinstallprompt` quando a página é
    // controlada por um SW com handler `fetch`. Registrar no `load`
    // fazia o app só ficar instalável na SEGUNDA visita.
    // ============================================================
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(function (reg) { console.log('[uKeep] SW registrado:', reg.scope); })
        .catch(function (err) { console.warn('[uKeep] Falha ao registrar SW:', err); });
    }

    // ============================================================
    // HISTORY SENTINEL — impede que o "voltar" feche o browser/PWA.
    // Empilhado AQUI, antes do app carregar, para cobrir também o
    // boot. O app (ukeep-app.html) reempilha após cada navegação.
    // ============================================================
    (function () {
      var SENTINEL = '__ukeep_root_sentinel__';
      try {
        history.pushState({ ukeep: SENTINEL }, '', location.href);
      } catch (e) { /* file:// ou sandbox */ }

      window.addEventListener('popstate', function (event) {
        // Se o app já assumiu o controle (ukeepBoot rodou), não interferir:
        // o handler de popstate do app cuida da navegação interna.
        if (window.__ukeepHistoryOwned) return;

        // Sem app carregado ainda (tela de login/boot), apenas re-empilha
        // uma vez para não fechar o browser. Se o usuário insistir, sai.
        if (event.state && event.state.ukeep === SENTINEL) return;
        try { history.pushState({ ukeep: SENTINEL }, '', location.href); } catch (e) { }
      });
    })();

    function bootRender(html, stateClass) {
      var el = document.getElementById('boot-content');
      if (el) {
        el.innerHTML = '<div class="state ' + (stateClass || '') + '">' + html + '</div>';
      }
      // Splash only while loading; the welcome/error states go back to the
      // card (see body.ukeep-splash in the stylesheet).
      document.body.classList.toggle('ukeep-splash', stateClass === 'loading');
    }

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function apiCall(action, params) {
      var parts = ['action=' + encodeURIComponent(action)];
      if (params) {
        Object.keys(params).forEach(function (k) {
          if (params[k] !== undefined && params[k] !== null) {
            parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
          }
        });
      }
      var url = ORCHESTRATOR_URL + '?' + parts.join('&');

      return fetch(url, { method: 'GET', mode: 'cors', redirect: 'follow' })
        .then(function (response) {
          if (!response.ok) return { success: false, error: 'http_' + response.status };
          return response.text().then(function (text) {
            try { return JSON.parse(text); } catch (e) { return { success: true, raw: text }; }
          });
        })
        .catch(function (err) {
          return { success: false, error: 'network_error', message: err.message };
        });
    }

    function getCachedApp() {
      try {
        var html = localStorage.getItem(APP_CACHE_KEY);
        var ts = localStorage.getItem(APP_CACHE_TS_KEY);
        if (!html || !ts) return null;
        var age = Date.now() - parseInt(ts, 10);
        if (age > APP_CACHE_TTL_MS) {
          localStorage.removeItem(APP_CACHE_KEY);
          localStorage.removeItem(APP_CACHE_TS_KEY);
          return null;
        }
        return html;
      } catch (e) {
        return null;
      }
    }

    function setCachedApp(html) {
      try {
        localStorage.setItem(APP_CACHE_KEY, html);
        localStorage.setItem(APP_CACHE_TS_KEY, Date.now().toString());
      } catch (e) { /* ignore */ }
    }

    // Primes the one-shot globals the in-app first paint consumes — property,
    // active campaigns, own profile — plus the i18n bundle, so the app boots
    // straight to content without follow-up round-trips. `window` globals
    // survive the DOM injection performed by bootApp.
    //
    // Every global is cleared first so a fresh session can never inherit stale
    // data from a previous one in the same tab.
    function primeBootPayload(res) {
      window.__ukeepInitialProperty = null;
      window.__ukeepInitialCampaigns = null;
      window.__ukeepInitialProfile = null;

      if (!res) return;

      // The app reads `window.__ukeepI18n` (bootstrapI18n) — priming it here is
      // what removes the extra `i18n` round-trip on a cache-hit boot.
      if (res.i18n) {
        window.__ukeepI18n = {
          lang: res.i18n.lang,
          default_lang: res.i18n.default_lang,
          supported_langs: res.i18n.supported_langs,
          dictionary: res.i18n.dictionary || {}
        };
      }

      if (res.property) window.__ukeepInitialProperty = res.property;
      if (res.campaigns) window.__ukeepInitialCampaigns = res.campaigns;
      if (res.user_profile) window.__ukeepInitialProfile = res.user_profile;
    }

    function injectHtml(html) {
      var range = document.createRange();
      range.selectNode(document.body);
      var docFragment = range.createContextualFragment(html);
      document.body.innerHTML = '';
      document.body.classList.add('app-loaded');
      document.body.append(docFragment);
    }

    function bootApp(html) {
      injectHtml(html);
      setTimeout(function () {
        if (typeof window.ukeepBoot === 'function') {
          try {
            window.ukeepBoot();
          } catch (e) {
            console.error('ukeepBoot error:', e);
            document.body.innerHTML = '<div class="state error" style="margin:20px;">Erro ao inicializar: ' + e.message + '</div>';
          }
        } else {
          document.body.innerHTML = '<div class="state error" style="margin:20px;">Aplicação inválida: hook de boot ausente.</div>';
        }
      }, 0);
    }

    function boot() {
      var key = getQueryParam('k');

      // No key in the URL: welcome screen with a field so users who saved
      // their key can type/paste it (raw key only).
      if (!key) {
        renderKeyForm('');
        return;
      }

      authenticateWithKey(key);
    }

    // Welcome screen rendered when no ?k= link is present. `errorMessage`, when
    // set, is shown below the field (used on validation/auth failure).
    function renderKeyForm(errorMessage) {
      var inputStyle = 'width:100%;box-sizing:border-box;padding:12px;' +
        'border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;';
      var buttonStyle = 'width:100%;margin-top:10px;padding:12px;border:0;' +
        'border-radius:8px;background:#0f172a;color:#fff;font-size:1rem;' +
        'font-weight:600;cursor:pointer;';

      bootRender(
        '<strong>Bem-vindo.</strong><br><br>' +
        'Digite ou cole sua chave de acesso para entrar:' +
        '<div style="margin-top:12px;">' +
        '<input id="ukeep-key-input" type="text" autocomplete="off" ' +
        'autocapitalize="off" spellcheck="false" ' +
        'placeholder="Cole aqui sua chave de acesso" style="' + inputStyle + '">' +
        '<button id="ukeep-key-submit" type="button" style="' + buttonStyle + '">Entrar</button>' +
        '</div>' +
        (errorMessage
          ? '<div style="margin-top:12px;color:#991b1b;font-size:0.9rem;">' + errorMessage + '</div>'
          : '') +
        '<p style="margin:16px 0 0;font-size:0.85rem;color:#64748b;">' +
        'Você também pode entrar pelo link enviado pelo seu coordenador ou supervisor.</p>',
        'success'
      );

      var input = document.getElementById('ukeep-key-input');
      var button = document.getElementById('ukeep-key-submit');

      function submit() {
        var value = (input.value || '').trim();
        if (!value) {
          renderKeyForm('Informe sua chave de acesso.');
          return;
        }
        authenticateWithKey(value);
      }

      button.addEventListener('click', submit);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') submit();
      });
      input.focus();
    }

    // Shared authentication sequence for both entry points (the ?k= link and
    // the manual key form). Uses the aggregated `bootstrap` action so the whole
    // first screen — session, i18n, property, profile and active campaigns —
    // arrives in a single Apps Script round-trip. Each GAS call pays a 302
    // redirect + cold start, so collapsing the waterfall is what makes boot
    // fast (previously auth -> renderApp -> listCampaigns, sequential).
    function authenticateWithKey(key) {
      bootRender('<span class="spinner"></span> Autenticando...', 'loading');

      // Decide the cache state BEFORE the call so we only pull the ~385KB app
      // HTML when we don't already have it cached.
      var cachedHtml = getCachedApp();
      var params = { k: key };
      if (!cachedHtml) params.includeHtml = 1;

      apiCall('bootstrap', params).then(function (res) {
        if (!res || !res.success) {
          var error = (res && res.error) || 'desconhecido';
          var message = 'Não foi possível autenticar.';
          if (error === 'invalid_key') {
            message = 'Chave inválida ou expirada. Confira a chave e tente de novo, ' +
              'ou solicite um novo link ao seu coordenador ou supervisor.';
          } else if (error === 'network_error') {
            message = 'Erro de rede ou bloqueio do navegador. Tente novamente.';
          } else {
            message = 'Não foi possível autenticar. ' +
              '<small>Erro: ' + error + '</small>';
          }
          renderKeyForm(message);
          return;
        }

        var auth = res.auth || {};

        sessionStorage.setItem('session_token', auth.session_token);
        sessionStorage.setItem('profile', auth.profile);
        sessionStorage.setItem('person_id', auth.person_id);
        // `bootstrap` mints a fresh session whose acting_profile is the real
        // profile, so persisting it here lets the app skip a redundant `me`
        // round-trip during boot (see syncActingProfile).
        sessionStorage.setItem('acting_profile', auth.acting_profile || auth.profile);
        if (auth.source) sessionStorage.setItem('source', auth.source);
        if (auth.property_id) sessionStorage.setItem('property_id', auth.property_id);
        if (auth.property_name) sessionStorage.setItem('property_name', auth.property_name);
        if (auth.spreadsheet_id) sessionStorage.setItem('spreadsheet_id', auth.spreadsheet_id);

        // Feed the in-app first paint (and i18n) before the app script runs.
        primeBootPayload(res);

        var html = cachedHtml;
        if (!html && res.html) {
          html = res.html;
          setCachedApp(html);
        }
        if (!html) {
          bootRender('Falha ao carregar a aplicação. Tente novamente.', 'error');
          return;
        }

        bootApp(html);
      }).catch(function (err) {
        renderKeyForm('Erro inesperado: ' + err.message);
      });
    }

    // ---- PWA: detecção de plataforma ----
    window.ukeepIsIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    window.ukeepIsStandalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    if (window.ukeepIsIOS && !window.ukeepIsStandalone) {
      var hint = document.getElementById('ukeep-ios-hint');
      if (hint) hint.style.display = 'block';
    }

    // Chrome/Edge: só dispara se o SW estiver ativo e o manifest válido.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.deferredPrompt = e;
      var btn = document.getElementById('ukeep-install-btn');
      if (btn) btn.style.display = 'block';
    });

    function ukeepInstall() {
      var btn = document.getElementById('ukeep-install-btn');
      if (window.deferredPrompt) {
        window.deferredPrompt.prompt();
        window.deferredPrompt.userChoice.then(function (choice) {
          if (choice.outcome === 'accepted') {
            if (btn) btn.style.display = 'none';
          }
          window.deferredPrompt = null;
        });
      }
    }
    window.ukeepInstall = ukeepInstall;

    window.addEventListener('appinstalled', function () {
      var btn = document.getElementById('ukeep-install-btn');
      if (btn) btn.style.display = 'none';
      window.deferredPrompt = null;
    });

    boot();
  </script>
</body>

</html>
